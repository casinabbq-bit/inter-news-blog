name: Automazione Blog Inter

on:
  schedule:
    - cron: '0 7 * * *' # Gira ogni giorno alle 7:00 del mattino (ora UTC, circa le 8/9 in Italia)
  workflow_dispatch: # Ti permette di farlo partire anche a mano quando vuoi

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permette a GitHub di salvare l'articolo nel tuo repository

    steps:
    - name: Copia il codice sul computer virtuale
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa i pacchetti necessari
      run: pip install requests

    - name: Fai lavorare l'AI
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      run: python agent.py

    - name: Pubblica l'articolo sul repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add _posts/*.md
        git commit -m "Nuovo articolo automatico" || exit 0
        git push
