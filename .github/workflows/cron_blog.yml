name: Automazione Blog Inter (Free)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Copia il codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa i pacchetti necessari (Requests e DuckDuckGo)
      run: pip install requests duckduckgo-search

    - name: Fai lavorare l'AI
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python agent.py

    - name: Pubblica l'articolo sul repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add _posts/*.md
        git commit -m "Nuovo articolo automatico gratuito" || exit 0
        git push
