name: Automazione Blog Inter (Free)

on:
  workflow_dispatch: # Ti permette di avviarlo a mano con un pulsante
  schedule:
    - cron: '0 8 * * *' # Questo lo fa partire in automatico tutti i giorni

jobs:
  aggiorna-blog:
    runs-on: ubuntu-latest
    
    # Questo assicura che il robot abbia sempre i permessi di scrittura, a prescindere dalle impostazioni
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo-search groq requests

      - name: Fai lavorare l'AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agent.py
        
      - name: Salva i nuovi articoli sul repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiunto nuovo articolo generato dall'AI"
